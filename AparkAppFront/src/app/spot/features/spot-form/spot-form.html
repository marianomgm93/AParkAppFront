<div class="spot-form-container">
  <h2>{{ isEditing() ? 'Editar Espacio' : 'Nuevo Espacio' }}</h2>

  <form [formRoot]="spotForm">
    <div class="form-group">
      <label for="spotNumber">Número de Espacio:</label>
      <input id="spotNumber" type="number" [formField]="spotForm.spotNumber" />
      
      @if (spotForm.spotNumber().touched() && spotForm.spotNumber().invalid()) {
        <span class="error-msg">El número de espacio es requerido y debe ser mayor a 0...</span>
      }
    </div>

    <div class="form-group">
      <label for="status">Estado:</label>
      <select id="status" [formField]="spotForm.status">
        <option value="FREE">Libre (FREE)</option>
        <option value="OCCUPIED">Ocupado (OCCUPIED)</option>
      </select>
    </div>

    <div class="form-actions">
      <button type="submit">
        {{ isEditing() ? 'Actualizar' : 'Guardar' }}
      </button>
      <button type="button" class="btn-cancel" (click)="onCancel()">
        {{ isEditing() ? 'Cancelar' : 'Volver' }}
      </button>
    </div>
  </form>
</div>
